name: Update Install Badge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scrape install count
        id: scrape
        run: |
          COUNT=$(curl -s "https://userstyles.world/style/22026/wanikani-elementary-dark" \
            | grep -A1 "Total installs" \
            | grep -oP '\d+' \
            | head -1)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Push badge.json to meta branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin meta 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/meta; then
            git worktree add /tmp/meta origin/meta
          else
            git worktree add --orphan -b meta /tmp/meta
          fi

          echo '{"schemaVersion":1,"label":"installs","message":"${{ steps.scrape.outputs.count }}","color":"#679cd0"}' \
            > /tmp/meta/badge.json

          cd /tmp/meta
          git add badge.json
          git diff --staged --quiet || git commit -m "chore: update install badge"
          git push origin meta
